name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment and debug keystore
        env:
          SECRET_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env

          # Prioritize persistent keystore to preserve signing signature across updates
          if [ -n "$SECRET_DEBUG_KEYSTORE" ]; then
            echo "Restoring debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "$SECRET_DEBUG_KEYSTORE" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from repository file debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "::error::Neither DEBUG_KEYSTORE_BASE64 secret nor debug.keystore.base64 file was found!"
            echo "::error::To ensure your app can cleanly update without signature mismatch (INSTALL_FAILED_UPDATE_INCOMPATIBLE),"
            echo "::error::please either commit debug.keystore.base64 to git or add DEBUG_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi

          ls -la debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App (Assemble Debug APK)
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
